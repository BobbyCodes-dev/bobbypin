name: tests

# The tool claims to run on Linux, macOS and Windows. This proves it on all
# three instead of assuming it from a Linux laptop.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the tools the suite builds fixtures with
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Recovery suite
        run: python tests/test_recover.py

      - name: Installer report (does not fail the job)
        continue-on-error: true
        run: python setup.py --check

      - name: Analysis layer smoke (POSIX only)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: |
          python bobbypin.py --help
          python recover.py --help
