name: tests

# The tool claims to run on Linux, macOS and Windows. This proves it on all
# three instead of assuming it from a Linux laptop.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: ${{ matrix.os }} / python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the tools the suite builds fixtures with
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Recovery suite
        run: python tests/test_recover.py

      - name: Installer report (does not fail the job)
        continue-on-error: true
        run: python setup.py --check

      # The wrappers are what a user actually types. Running setup.py directly
      # above does not prove the wrapper finds Python and forwards its arguments.
      # `--help` must exit 0; `--check` legitimately exits 1 on a bare runner
      # (nothing is installed yet), so only a harder failure counts as a break.
      - name: Installer wrapper (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $help = ./install.ps1 --help 2>&1 | Out-String
          if ($help -notmatch 'one-command setup') {
            Write-Host $help
            throw "install.ps1 did not reach setup.py"
          }
          ./install.ps1 --check
          $rc = $LASTEXITCODE
          if ($rc -gt 1) { throw "install.ps1 failed hard (exit $rc)" }
          exit 0

      - name: Installer wrapper (POSIX)
        if: runner.os != 'Windows'
        run: |
          ./install.sh --help | grep -q 'one-command setup' \
            || { echo "install.sh did not reach setup.py"; exit 1; }
          set +e
          ./install.sh --check
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then echo "install.sh failed hard (exit $rc)"; exit 1; fi

      - name: Analysis layer smoke (POSIX only)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: |
          python bobbypin.py --help
          python recover.py --help
